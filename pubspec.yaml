name: mamba_fast_tracker
description: "Mamba Fast Tracker technical challenge."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  path: ^1.9.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
