name: mamba_fast_tracker
description: "Mamba Fast Tracker technical challenge."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.2

dependencies:
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.0
  image_picker: ^1.2.3
  intl: any
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  timezone: ^0.11.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#5A189A"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
